[project]
name = "vector-toolbox-mcp"
version = "0.1.0"
description = "MCP Toolbox for vector databases - a single MCP server with pluggable vector-store backends. Pinecone first."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.9.0",
    "pinecone>=10.0.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
cohere = ["cohere>=5.0"]
local = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]
all = ["openai>=1.40", "cohere>=5.0", "sentence-transformers>=3.0"]

[project.scripts]
vector-toolbox-mcp = "vectortoolbox.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectortoolbox"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
