# docker compose up -d                      -> server on http://127.0.0.1:8000/mcp
# docker compose --profile chroma up -d     -> plus a Chroma server it uses as its "default" client
# docker compose --profile weaviate up -d   -> plus a Weaviate server (set VTB_WEAVIATE_HOST below)
#
# Secrets come from .env (copy .env.example). Set VTB_AUTH_TOKEN before
# exposing the port beyond localhost.

services:
  vector-toolbox:
    image: ghcr.io/salindahulangamuwa/vector-toolbox-mcp:latest
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      VTB_TRANSPORT: http
      VTB_HOST: 0.0.0.0
      VTB_PORT: "8000"
      # Uncomment with `--profile chroma` to use the bundled Chroma server
      # instead of the in-container persistent store:
      # VTB_CHROMA_CLIENT: http
      # VTB_CHROMA_HOST: chroma
      # VTB_CHROMA_PORT: "8000"
      # With `--profile weaviate`:
      # VTB_WEAVIATE_CLIENT: local
      # VTB_WEAVIATE_HOST: weaviate
    ports:
      - "127.0.0.1:8000:8000"   # loopback only; change deliberately, with a token set
    volumes:
      - vtb-data:/data

  chroma:
    profiles: ["chroma"]
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma-data:/data
    ports:
      - "127.0.0.1:8001:8000"

  weaviate:
    profiles: ["weaviate"]
    image: cr.weaviate.io/semitechnologies/weaviate:1.37.0
    restart: unless-stopped
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate-data:/var/lib/weaviate
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50051:50051"

volumes:
  vtb-data:
  chroma-data:
  weaviate-data:
