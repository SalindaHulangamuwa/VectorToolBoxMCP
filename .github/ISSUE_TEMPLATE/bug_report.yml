name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Tool call or steps to reproduce
      description: The tool name and arguments, with API keys and private data removed.
      render: json
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `vector-toolbox-mcp --version`, and the vectortoolbox_status tool if you can run it.
  - type: dropdown
    id: install
    attributes:
      label: How it is run
      options: [uvx, pip / source checkout, Docker (stdio), Docker (HTTP)]
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Claude Desktop, Antigravity, Cursor, VS Code, ...
