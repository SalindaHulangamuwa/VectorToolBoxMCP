name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv pip install --system -e ".[dev,chroma]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: MCP handshake over stdio
        run: python scripts/handshake_check.py "$(which vector-toolbox-mcp)"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build sdist + wheel
        run: uv build
      - name: Install the wheel cleanly and run it
        run: |
          uv venv /tmp/wheel-env
          VIRTUAL_ENV=/tmp/wheel-env uv pip install dist/*.whl
          /tmp/wheel-env/bin/vector-toolbox-mcp --version

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vector-toolbox-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test HTTP + auth
        run: |
          docker run -d --name vtb -p 8000:8000 -e VTB_AUTH_TOKEN=ci-token vector-toolbox-mcp:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/mcp)" = "401"
          docker logs vtb
